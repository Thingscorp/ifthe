# ============================================================
# ifthe :: DASHBOARD stack  (Phase 5 - app index + ambient sleep screen)
#   - glance       app index (service health + bookmarks), config-driven
#   - frontdoor    static launcher + idle->bento sleep screen (Caddy, read-only)
#   - agenda-export (optional) read-only Nextcloud CalDAV -> $DATA_ROOT/dashboard/agenda.json
#
# Bring up:   docker compose -f docker-compose.dashboard.yml up -d --build
#
# LAN-only today, built with a consumer-readiness seam: the front door is plain
# static files behind Caddy with an (OFF) forward_auth block ready for SSO later.
# Everything here is READ-ONLY: no service can move money or write to a calendar.
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  ifthe_net:
    external: true

services:

  # ---- Glance : app index / service health -----------------------------------
  glance:
    image: glanceapp/glance:v0.8.5   # pinned stable; GitHub releases API + Docker Hub tags, verified 2026-06-23
    container_name: glance
    restart: unless-stopped
    logging: *default-logging
    networks: [ifthe_net]
    ports:
      - "8085:8080"
    volumes:
      - "../dashboard/glance.yml:/app/config/glance.yml:ro"

  # ---- Front door : launcher + idle ambient "sleep" screen -------------------
  frontdoor:
    image: caddy:2-alpine
    container_name: frontdoor
    restart: unless-stopped
    logging: *default-logging
    networks: [ifthe_net]
    ports:
      - "8086:80"
    volumes:
      - "../dashboard/frontdoor:/srv:ro"
      - "../dashboard/Caddyfile:/etc/caddy/Caddyfile:ro"
      # read-only agenda export drop (graceful empty state if absent)
      - "${DATA_ROOT}/dashboard:/srv/data:ro"

  # ---- Agenda exporter : read-only CalDAV -> agenda.json (OPTIONAL) ----------
  # Needs Nextcloud CalDAV creds in .env. Never writes to the calendar.
  agenda-export:
    build: ../../scripts/agenda-export
    image: ifthe/agenda-export
    container_name: agenda-export
    restart: unless-stopped
    logging: *default-logging
    networks: [ifthe_net]
    environment:
      CALDAV_URL: "${NEXTCLOUD_CALDAV_URL:-}"
      CALDAV_USER: "${NEXTCLOUD_CALDAV_USER:-}"
      CALDAV_APP_PASSWORD: "${NEXTCLOUD_CALDAV_APP_PASSWORD:-}"
      AGENDA_OUT: /out/agenda.json
      AGENDA_INTERVAL: "${AGENDA_INTERVAL:-900}"
    volumes:
      - "${DATA_ROOT}/dashboard:/out"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          python3 /app/agenda_export.py || echo "agenda export failed (will retry)";
          sleep "$$AGENDA_INTERVAL";
        done
