# Glance app index for ifthe. Schema: pages -> columns (small|full, max 3) -> widgets.
# Config path inside the container: /app/config/glance.yml ; default port 8080.
# NOTE: the monitor widget checks `url` from INSIDE the glance container. home.local may
# not resolve there — if a service shows down but is up, switch that site's url to its
# container name (e.g. http://paperless:8000) and keep the click-through on the LAN URL.
pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: sunday

      - size: full
        widgets:
          - type: monitor
            title: ifthe services
            cache: 1m
            sites:
              - title: Actual Budget
                url: https://home.local:5006
                allow-insecure: true
              - title: Nextcloud
                url: http://home.local:8081
              - title: Paperless-ngx
                url: http://home.local:8000
              - title: Mealie
                url: http://home.local:9925
              - title: Homebox
                url: http://home.local:7745
              - title: Wallos
                url: http://home.local:8282
              - title: Stirling PDF
                url: http://home.local:8090
              - title: AdGuard Home
                url: http://home.local:8083
              - title: Uptime Kuma
                url: http://home.local:3001

      - size: small
        widgets:
          - type: bookmarks
            groups:
              - title: ifthe
                links:
                  - title: Front door / sleep screen
                    url: http://home.local:8086
                  - title: Vaultwarden (Tailscale HTTPS)
                    url: https://your-box.your-tailnet.ts.net
